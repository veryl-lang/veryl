[package]
name                  = "veryl-component-macros"
version               = "0.1.1"
authors.workspace     = true
repository.workspace  = true
keywords.workspace    = true
categories.workspace  = true
license.workspace     = true
readme.workspace      = true
description.workspace = true
edition.workspace     = true

# No semver-checks pre-release hook here: a proc-macro crate exposes no
# library API surface, so cargo-semver-checks has nothing to inspect and
# exits non-zero, which would abort the release.

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote       = "1.0"
syn         = {version = "3.0", features = ["full"]}
