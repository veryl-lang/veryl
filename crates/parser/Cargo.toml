[package]
name                  = "veryl-parser"
version               = "0.22.0"
authors.workspace     = true
repository.workspace  = true
keywords.workspace    = true
categories.workspace  = true
license.workspace     = true
readme.workspace      = true
description.workspace = true
edition.workspace     = true
exclude               = ["build.rs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow        = {workspace = true}
bimap         = "0.6.3"
once_cell     = {workspace = true}
parol_runtime = {workspace = true}
paste         = {workspace = true}
regex         = {workspace = true}
scnr2         = {workspace = true}
serde         = {workspace = true}
thiserror     = {workspace = true}

[dev-dependencies]
postcard      = {workspace = true}

[target.'cfg(any(target_arch = "wasm32", kani))'.dependencies]
miette        = {workspace = true, features = ["fancy-no-syscall"]}

[target.'cfg(all(not(target_arch = "wasm32"), not(kani)))'.dependencies]
miette        = {workspace = true, features = ["fancy"]}

[build-dependencies]
parol         = {workspace = true, optional = true}
regex         = {workspace = true, optional = true}

[features]
default = ["build"]
build   = ["dep:parol", "dep:regex"]
