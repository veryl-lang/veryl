[project]
name = "filelist_a"
version = "0.1.0"

[build]
sourcemap_target = {type = "none"}

[dependencies]
b = {path = "../b"}
d = {path = "../d"}
e = {path = "../e"}

[properties]
for_asic = false

[[sv.filesets]]
root         = "ip"
files        = ["rtl/a_ip.sv"]
include_dirs = ["include"]

[[sv.filesets]]
root      = "ip"
enable_if = "for_asic"
files     = ["asic/a_ip_asic.sv"]
