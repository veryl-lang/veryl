version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: weekly
    day: "monday"
    time: "20:00"
  open-pull-requests-limit: 10
  # batch minor/patch bumps so the CI cache is invalidated once per week, not per crate
  groups:
    minor-patch:
      update-types: ["minor", "patch"]
  ignore:
  # parol 5.0.3 generates lookahead DFAs with cycles, which hangs the error
  # recovery of the generated parser. Drop this once a fixed version is released.
  - dependency-name: "parol"
    versions: ["5.0.3"]
