name: Deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  # rust-toolchain exported these two to the steps that followed it
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        continue-on-error: true
        with:
          shared-key: "${{ runner.os }}-release"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Setup veryl
        run:  cargo build --profile release-verylup
      - name: Build doc
        run: ../../../target/release-verylup/veryl doc
        working-directory: crates/std/veryl
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: std
          path: crates/std/veryl/target/doc/

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [std]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Download std
        uses: actions/download-artifact@v8.0.2
        with:
          name: std
          path: public
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cname: std.veryl-lang.org

  deploy-nightly:
    if: ${{ ! startsWith(github.ref, 'refs/tags/v') }}
    needs: [std]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Download std
        uses: actions/download-artifact@v8.0.2
        with:
          name: std
          path: public
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cname: std.veryl-lang.org
          destination_dir: nightly
