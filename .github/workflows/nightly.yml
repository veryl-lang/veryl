name: Nightly Build

on:
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:

env:
  CHANNEL: -nightly

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macOS-latest, windows-latest, windows-11-arm]
        rust: [stable]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: 'true'
    - name: Setup aarch64 mac
      if: matrix.os == 'macOS-latest'
      run: |
        rustup target add aarch64-apple-darwin
        rustup target add x86_64-apple-darwin
    # The manylinux container pins the published binaries to a glibc 2.17
    # baseline; the runner's own glibc is far newer.
    - name: Build for linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p .ci-home
        docker run --rm -v "${PWD}:/work" -w /work \
          -u "$(id -u):$(id -g)" -e HOME=/work/.ci-home -e CHANNEL \
          quay.io/pypa/manylinux2014_x86_64 \
          bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            make build_lnx
          '
        make release_lnx
    - name: Build for linux aarch64
      if: matrix.os == 'ubuntu-24.04-arm'
      run: |
        mkdir -p .ci-home
        docker run --rm -v "${PWD}:/work" -w /work \
          -u "$(id -u):$(id -g)" -e HOME=/work/.ci-home -e CHANNEL \
          quay.io/pypa/manylinux2014_aarch64 \
          bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            make build_lnx_aarch64
          '
        make release_lnx_aarch64
    - name: Build for macOS
      if: matrix.os == 'macOS-latest'
      run: make release_mac
    - name: Build for Windows
      if: matrix.os == 'windows-latest'
      run: make release_win
    - name: Build for Windows aarch64
      if: matrix.os == 'windows-11-arm'
      run: make release_win_aarch64
    - name: Create version file
      run: make release_version
    - name: Move archives
      run: |
        mkdir -p upload
        mv *.zip upload
        mv version upload
    - name: Upload
      uses: ryand56/r2-upload-action@latest
      with:
        r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
        r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
        r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        r2-bucket: ${{ secrets.R2_BUCKET }}
        source-dir: upload
        destination-dir: ./toolchain/nightly/
